<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/swiftly-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swiftly Xpress - Ionic React App</title>

  <!-- Primary Meta Tags -->
  <meta name="title" content="Swiftly Xpress - Fast & Reliable Delivery Service" />
  <meta name="description"
    content="Book fast and reliable delivery services with Swiftly Xpress. Get your packages delivered quickly with real-time tracking." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://swiftlyxpress.com/" />
  <meta property="og:title" content="Swiftly Xpress - Fast & Reliable Delivery Service" />
  <meta property="og:description"
    content="Book fast and reliable delivery services with Swiftly Xpress. Get your packages delivered quickly with real-time tracking." />
  <meta property="og:image" content="https://swiftlyxpress.com/swiftly-logo.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Swiftly Xpress" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://swiftlyxpress.com/" />
  <meta property="twitter:title" content="Swiftly Xpress - Fast & Reliable Delivery Service" />
  <meta property="twitter:description"
    content="Book fast and reliable delivery services with Swiftly Xpress. Get your packages delivered quickly with real-time tracking." />
  <meta property="twitter:image" content="https://swiftlyxpress.com/swiftly-logo.svg" />

  <!-- WhatsApp (uses Open Graph) -->
  <meta property="og:image:alt" content="Swiftly Xpress Logo" />

  <script>
    // Ensure React is available globally before any modules load
    window.React = window.React || {};
    window.ReactDOM = window.ReactDOM || {};
  </script>
  <!-- Google Maps JS (Places) - required for address autocomplete -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCGIhsqU7UY1eqFuuK1SomYPVnHiKkQXXo&libraries=places"
    async defer>
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
